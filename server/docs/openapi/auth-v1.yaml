openapi: 3.1.0
info:
  title: Canteen Smile Auth API
  version: 1.6.0
  description: Auth 服务当前已经实现的首次引导、登录、短信挑战、密码恢复、手机号绑定与换绑解绑、平台恢复能力和设备会话契约。
servers:
  - url: /api/auth/v1
paths:
  /password-encryption/challenges:
    post:
      operationId: createPasswordEncryptionChallenge
      summary: 创建一次性密码加密挑战
      description: 返回当前轮换 RSA 公钥、一次性 nonce 和服务端时间戳。RSA 密钥默认 30 天轮换；挑战默认 120 秒有效且只能原子消费一次。
      tags: [PasswordEncryption]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordEncryptionChallengeRequest'
      responses:
        '201':
          description: 一次性短期挑战创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordEncryptionChallengeApiResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/RuntimeUnavailable'}
  /sms/challenges:
    post:
      operationId: createSmsChallenge
      summary: 创建短信验证码挑战
      description: 创建五分钟有效的六位验证码，通过当前 SmsClient 策略发送；同手机号六十秒内禁止重发，并按手机号、来源 IP 和设备执行小时及每日限流。响应始终不泄露手机号绑定了哪些账号。
      tags: [SmsChallenge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsChallengeCreateRequest'
      responses:
        '201':
          description: 挑战创建且短信策略已接受发送请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsChallengeApiResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/RuntimeUnavailable'}
  /platform/bootstrap:
    post:
      operationId: bootstrapPlatformIdentity
      summary: 一次性创建首位平台超级管理员
      description: 仅当 IAM 和 Auth 均不存在平台管理员时可调用；恢复码只在本次响应展示。
      tags: [PlatformBootstrap]
      parameters:
        - name: X-Bootstrap-Secret
          in: header
          required: true
          description: 仅由安全环境变量提供的高熵首次引导密钥。
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformBootstrapRequest'
      responses:
        '201':
          description: 首位平台身份、Argon2id 凭证和恢复码创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformBootstrapApiResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /login/password:
    post:
      operationId: passwordLogin
      summary: 用户名密码登录
      description: 当前平台管理端在用户名和密码验证通过后直接建立设备会话；未来仅在异常设备或高风险场景按策略返回二次验证步骤。
      tags: [Login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: 用户名和密码验证成功，当前设备会话建立完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResultApiResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '423': {$ref: '#/components/responses/Locked'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /login/platform-recovery-code:
    post:
      operationId: platformRecoveryCodeLogin
      summary: 使用一次性恢复码完成受控验证
      description: 为后续账号恢复或高风险登录流程保留；普通用户名密码登录不调用此接口，也不会消费恢复码。
      tags: [Login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRecoveryLoginRequest'
      responses:
        '200':
          description: 当前设备独立会话建立成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionApiResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/RuntimeUnavailable'}
  /reauth/password:
    post:
      operationId: reauthenticatePlatformPassword
      summary: 平台敏感操作当前密码再认证
      description: 当前已登录平台身份使用 RSA 密码信封验证当前密码，成功后获得绑定单一操作且五分钟有效的一次性票据。
      tags: [Reauthentication]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordReauthRequest'}
      responses:
        '200':
          description: 再认证成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReauthTicketApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /password-resets/{ticket}/context:
    get:
      operationId: getPasswordResetContext
      summary: 查询一次性密码恢复上下文
      tags: [PasswordReset]
      parameters:
        - {$ref: '#/components/parameters/ResetTicket'}
      responses:
        '200':
          description: 恢复票据有效。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResetContextApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /password-resets/sms/verification:
    post:
      operationId: verifySmsPasswordReset
      summary: 验证手机号并开始自助找回密码
      description: 只能消费 PASSWORD_RESET 用途短信挑战；单账号直接返回三十分钟重置票据，多账号返回五分钟账号选择票据和安全候选。
      tags: [PasswordReset]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmsPasswordResetVerificationRequest'}
      responses:
        '200':
          description: 手机号验证成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmsPasswordResetResultApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BadRequest'}
  /password-resets/sms/account-selection:
    post:
      operationId: selectSmsPasswordResetAccount
      summary: 选择手机号绑定的具体找回账号
      description: 账号选择票据只能用于 PASSWORD_RESET 流程，服务端会重新计算当前候选集合摘要并原子消费票据。
      tags: [PasswordReset]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmsPasswordResetAccountSelectionRequest'}
      responses:
        '200':
          description: 已为选中账号签发三十分钟密码重置票据。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmsPasswordResetResultApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /password-resets/{ticket}/complete:
    post:
      operationId: completePasswordReset
      summary: 使用一次性票据设置新密码
      description: 校验密码策略及最近五次历史，成功后消费票据、更新 Argon2id 密码摘要并使全部旧设备会话失效。
      tags: [PasswordReset]
      parameters:
        - {$ref: '#/components/parameters/ResetTicket'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompletePasswordResetRequest'}
      responses:
        '200':
          description: 新密码设置成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResetCompleteApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /session:
    get:
      operationId: getCurrentSession
      summary: 查询当前设备会话
      tags: [Session]
      security: [{SaToken: []}]
      responses:
        '200':
          description: 当前设备会话有效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionApiResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /logout:
    post:
      operationId: logoutCurrentSession
      summary: 退出当前设备会话
      tags: [Session]
      security: [{SaToken: []}]
      responses:
        '200':
          description: 当前设备已退出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidApiResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /mobile/binding:
    get:
      operationId: getMobileBindingStatus
      summary: 查询当前账号手机号绑定状态
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      responses:
        '200':
          description: 返回脱敏手机号绑定状态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileBindingStatusApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /mobile/binding/challenges:
    post:
      operationId: createMobileBindingChallenge
      summary: 向首次绑定手机号发送验证码
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileBindingChallengeRequest'}
      responses:
        '201':
          description: MOBILE_BIND 用途挑战创建成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmsChallengeApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /mobile/binding/confirm:
    post:
      operationId: confirmMobileBinding
      summary: 验证手机号并完成首次绑定
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileBindingConfirmRequest'}
      responses:
        '200':
          description: 首次绑定成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileBindingStatusApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /mobile/binding/current-mobile/challenges:
    post:
      operationId: createCurrentMobileChallenge
      summary: 向当前已验证手机号发送敏感操作验证码
      description: 完整当前手机号由 Auth 解密后直接交给短信策略，前端始终只能看到脱敏号码。
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CurrentMobileChallengeRequest'}
      responses:
        '201':
          description: MOBILE_CHANGE 用途挑战创建成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmsChallengeApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/RuntimeUnavailable'}
  /mobile/binding/current-mobile/verification:
    post:
      operationId: verifyCurrentMobile
      summary: 验证当前手机号并签发单用途票据
      description: 票据只允许 MOBILE_CHANGE 或 MOBILE_UNBIND 中的一个动作，五分钟有效且只能消费一次。
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CurrentMobileVerificationRequest'}
      responses:
        '200':
          description: 当前手机号验证成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReauthTicketApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /mobile/binding/change/challenges:
    post:
      operationId: createMobileChangeChallenge
      summary: 向新手机号发送换绑验证码
      description: 必须携带刚完成当前手机号或当前密码验证后取得的 MOBILE_CHANGE 单用途票据。
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileChangeChallengeRequest'}
      responses:
        '201':
          description: 新手机号 MOBILE_CHANGE 用途挑战创建成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmsChallengeApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /mobile/binding/change/confirm:
    post:
      operationId: confirmMobileChange
      summary: 完成手机号换绑
      description: 同时消费换绑再认证票据和新手机号验证码；旧绑定标记为已替代，成功后全部设备会话失效。
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileChangeConfirmRequest'}
      responses:
        '200':
          description: 手机号换绑成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileBindingStatusApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /mobile/binding/unbind/confirm:
    post:
      operationId: confirmMobileUnbind
      summary: 完成手机号解绑
      description: 消费只允许解绑的一次性再认证票据，撤销当前绑定并使全部设备会话失效。
      tags: [MobileSecurity]
      security: [{SaToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileUnbindConfirmRequest'}
      responses:
        '200':
          description: 手机号解绑成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileBindingStatusApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    ResetTicket:
      name: ticket
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43,128}$'
  securitySchemes:
    SaToken:
      type: apiKey
      in: header
      name: satoken
  responses:
    BadRequest:
      description: 参数、密码、验证码门槛、恢复码或一次性票据不符合要求。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    Unauthorized:
      description: 未登录或会话已失效。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    Forbidden:
      description: 当前应用入口不匹配。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    Locked:
      description: 密码连续失败触发十五分钟临时锁定。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    Conflict:
      description: 首位平台管理员已经存在，或一次性密码恢复状态发生并发变化。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    UpstreamUnavailable:
      description: IAM 内部服务暂时不可用或返回无效响应。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    RuntimeUnavailable:
      description: Redis 认证运行态或短信发送策略暂时不可用。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    RateLimited:
      description: 短信重发间隔未到，或手机号、来源 IP、设备达到小时或每日发送上限。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  schemas:
    DeviceRequest:
      type: object
      additionalProperties: false
      required: [deviceId, deviceType, deviceName]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 128}
        deviceType: {type: string, minLength: 1, maxLength: 64}
        deviceName: {type: string, minLength: 1, maxLength: 128}
        userAgentSummary: {type: [string, 'null'], maxLength: 256}
    SmsChallengeCreateRequest:
      type: object
      additionalProperties: false
      required: [purpose, mobile, deviceId]
      properties:
        purpose:
          type: string
          enum: [LOGIN, ACTIVATION, PASSWORD_RESET, MOBILE_BIND, MOBILE_CHANGE, ADMIN_REAUTH, PLATFORM_SECOND_FACTOR]
        mobile:
          type: string
          minLength: 1
          maxLength: 32
          writeOnly: true
          description: 完整手机号仅在 Auth 当前调用链和短信策略内使用。
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: 客户端持久化稳定设备标识，仅以摘要进入 Redis 限流 Key。
        captchaTicket:
          type: [string, 'null']
          maxLength: 256
          writeOnly: true
    SmsChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, maskedMobile, expiresAt, resendAt]
      properties:
        challengeId: {type: string, format: uuid}
        maskedMobile: {type: string}
        expiresAt: {type: string, format: date-time}
        resendAt: {type: string, format: date-time}
    PasswordEncryptionChallengeRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [PLATFORM_BOOTSTRAP, PLATFORM_PASSWORD_LOGIN, PLATFORM_REAUTH_PASSWORD, TENANT_ACCOUNT_ACTIVATION, TENANT_PASSWORD_LOGIN, TENANT_PASSWORD_RESET, TENANT_REAUTH_PASSWORD]
    PasswordEncryptionChallenge:
      type: object
      additionalProperties: false
      required: [purpose, keyId, publicKey, nonce, timestamp, expiresAt, keyAlgorithm, contentAlgorithm]
      properties:
        purpose:
          type: string
          enum: [PLATFORM_BOOTSTRAP, PLATFORM_PASSWORD_LOGIN, PLATFORM_REAUTH_PASSWORD, TENANT_ACCOUNT_ACTIVATION, TENANT_PASSWORD_LOGIN, TENANT_PASSWORD_RESET, TENANT_REAUTH_PASSWORD]
        keyId: {type: string, format: uuid}
        publicKey:
          type: string
          description: Base64 编码的 X.509 SubjectPublicKeyInfo RSA 公钥。
        nonce: {type: string, minLength: 32, maxLength: 128}
        timestamp: {type: integer, format: int64, minimum: 1}
        expiresAt: {type: string, format: date-time}
        keyAlgorithm: {type: string, const: RSA-OAEP-256}
        contentAlgorithm: {type: string, const: A256GCM}
    PasswordEnvelopeRequest:
      type: object
      additionalProperties: false
      required: [keyId, nonce, timestamp, encryptedKey, iv, ciphertext]
      properties:
        keyId: {type: string, maxLength: 64}
        nonce: {type: string, maxLength: 128}
        timestamp: {type: integer, format: int64, minimum: 1}
        encryptedKey:
          type: string
          maxLength: 1024
          description: RSA-OAEP-SHA256 加密的 AES-256 原始密钥，使用标准 Base64。
        iv:
          type: string
          maxLength: 64
          description: AES-GCM 96 位随机 IV，使用标准 Base64。
        ciphertext:
          type: string
          maxLength: 2048
          description: AES-GCM 密码密文和 128 位认证标签，使用标准 Base64。
    PlatformBootstrapRequest:
      type: object
      additionalProperties: false
      required: [username, passwordEnvelope]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        displayName: {type: [string, 'null'], maxLength: 128}
        passwordEnvelope: {$ref: '#/components/schemas/PasswordEnvelopeRequest'}
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [appCode, username, passwordEnvelope, device]
      properties:
        appCode:
          type: string
          const: PLATFORM_ADMIN
        username: {type: string, minLength: 1, maxLength: 64}
        passwordEnvelope: {$ref: '#/components/schemas/PasswordEnvelopeRequest'}
        rememberMe: {type: boolean, default: false}
        device: {$ref: '#/components/schemas/DeviceRequest'}
        captchaTicket: {type: [string, 'null'], maxLength: 256, writeOnly: true}
    PlatformRecoveryLoginRequest:
      type: object
      additionalProperties: false
      required: [secondFactorTicket, recoveryCode]
      properties:
        secondFactorTicket: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        recoveryCode: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    PasswordReauthRequest:
      type: object
      additionalProperties: false
      required: [passwordEnvelope, allowedAction]
      properties:
        passwordEnvelope: {$ref: '#/components/schemas/PasswordEnvelopeRequest'}
        allowedAction:
          type: string
          enum: [TENANT_OWNER_PASSWORD_RESET, TENANT_USER_CREATE, TENANT_USER_ROLE_ASSIGN, MOBILE_CHANGE, MOBILE_UNBIND, PLATFORM_SMS_POLICY_UPDATE]
    SmsPasswordResetVerificationRequest:
      type: object
      additionalProperties: false
      required: [appCode, challengeId, code]
      properties:
        appCode: {type: string, enum: [TENANT_ADMIN, TENANT_PORTAL]}
        challengeId: {type: string, maxLength: 64}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    SmsPasswordResetAccountSelectionRequest:
      type: object
      additionalProperties: false
      required: [appCode, accountSelectorTicket, accountId]
      properties:
        appCode: {type: string, enum: [TENANT_ADMIN, TENANT_PORTAL]}
        accountSelectorTicket:
          type: string
          maxLength: 256
          writeOnly: true
        accountId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
    MobileAccountCandidate:
      type: object
      additionalProperties: false
      required: [accountId, tenantName, organizationName, username, displayName]
      properties:
        accountId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        tenantName: {type: string}
        organizationName: {type: string}
        username: {type: string}
        displayName: {type: string}
        latestLoginTime: {type: [string, 'null'], format: date-time}
    SmsPasswordResetResult:
      type: object
      additionalProperties: false
      required: [nextStep, accountCandidates]
      properties:
        nextStep:
          type: string
          enum: [RESET_PASSWORD, ACCOUNT_SELECTION_REQUIRED]
        passwordResetTicket:
          type: [string, 'null']
          writeOnly: true
          pattern: '^[A-Za-z0-9_-]{43,128}$'
        accountSelectorTicket:
          type: [string, 'null']
          writeOnly: true
          maxLength: 256
        accountCandidates:
          type: array
          items: {$ref: '#/components/schemas/MobileAccountCandidate'}
    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [passwordEnvelope]
      properties:
        passwordEnvelope: {$ref: '#/components/schemas/PasswordEnvelopeRequest'}
    ReauthTicket:
      type: object
      additionalProperties: false
      required: [reauthTicket, expiresAt]
      properties:
        reauthTicket: {type: string, writeOnly: true, pattern: '^[A-Za-z0-9_-]{43,128}$'}
        expiresAt: {type: string, format: date-time}
    MobileBindingChallengeRequest:
      type: object
      additionalProperties: false
      required: [mobile, deviceId]
      properties:
        mobile: {type: string, minLength: 1, maxLength: 32, writeOnly: true}
        deviceId: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        captchaTicket: {type: [string, 'null'], maxLength: 256, writeOnly: true}
    MobileBindingConfirmRequest:
      type: object
      additionalProperties: false
      required: [mobile, challengeId, code]
      properties:
        mobile: {type: string, minLength: 1, maxLength: 32, writeOnly: true}
        challengeId: {type: string, minLength: 1, maxLength: 128}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    CurrentMobileChallengeRequest:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        captchaTicket: {type: [string, 'null'], maxLength: 256, writeOnly: true}
    CurrentMobileVerificationRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code, allowedAction]
      properties:
        challengeId: {type: string, minLength: 1, maxLength: 128}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        allowedAction: {type: string, enum: [MOBILE_CHANGE, MOBILE_UNBIND]}
    MobileChangeChallengeRequest:
      type: object
      additionalProperties: false
      required: [reauthTicket, mobile, deviceId]
      properties:
        reauthTicket: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        mobile: {type: string, minLength: 1, maxLength: 32, writeOnly: true}
        deviceId: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        captchaTicket: {type: [string, 'null'], maxLength: 256, writeOnly: true}
    MobileChangeConfirmRequest:
      type: object
      additionalProperties: false
      required: [reauthTicket, newMobile, newChallengeId, newCode]
      properties:
        reauthTicket: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        newMobile: {type: string, minLength: 1, maxLength: 32, writeOnly: true}
        newChallengeId: {type: string, minLength: 1, maxLength: 128}
        newCode: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    MobileUnbindConfirmRequest:
      type: object
      additionalProperties: false
      required: [reauthTicket]
      properties:
        reauthTicket: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
    MobileBindingStatus:
      type: object
      additionalProperties: false
      required: [bound]
      properties:
        bound: {type: boolean}
        maskedMobile: {type: [string, 'null']}
        verifiedTime: {type: [string, 'null'], format: date-time}
    PasswordResetContext:
      type: object
      additionalProperties: false
      required: [username, displayName, tenantName, organizationName, expiresAt]
      properties:
        username: {type: string}
        displayName: {type: string}
        tenantName: {type: string}
        organizationName: {type: string}
        expiresAt: {type: string, format: date-time}
    PasswordResetComplete:
      type: object
      additionalProperties: false
      required: [username, nextStep]
      properties:
        username: {type: string}
        nextStep: {type: string, const: LOGIN}
    PlatformBootstrap:
      type: object
      additionalProperties: false
      required: [platformIdentityId, username, recoveryCodes, nextStep]
      properties:
        platformIdentityId: {type: string, pattern: '^[1-9][0-9]*$'}
        username: {type: string}
        recoveryCodes:
          type: array
          minItems: 5
          maxItems: 20
          items: {type: string}
        nextStep: {type: string}
    LoginResult:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          enum: [AUTHENTICATED, SECOND_FACTOR_REQUIRED]
        session:
          oneOf:
            - {$ref: '#/components/schemas/Session'}
            - {type: 'null'}
        secondFactorTicket: {type: [string, 'null']}
    Session:
      type: object
      additionalProperties: false
      required: [tokenName, tokenValue, sessionId, appCode, identityType, accountId, idleExpiresAt, absoluteExpiresAt]
      properties:
        tokenName: {type: string}
        tokenValue: {type: string, writeOnly: true}
        sessionId: {type: string, format: uuid}
        appCode: {type: string, const: PLATFORM_ADMIN}
        identityType: {type: string, const: PLATFORM_IDENTITY}
        accountId: {type: string, pattern: '^[1-9][0-9]*$'}
        tenantId: {type: ['null']}
        organizationId: {type: ['null']}
        idleExpiresAt: {type: string, format: date-time}
        absoluteExpiresAt: {type: string, format: date-time}
    PlatformBootstrapApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PlatformBootstrap'}
    PasswordEncryptionChallengeApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PasswordEncryptionChallenge'}
    SmsChallengeApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SmsChallenge'}
    LoginResultApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LoginResult'}
    SessionApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Session'}
    ReauthTicketApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ReauthTicket'}
    MobileBindingStatusApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/MobileBindingStatus'}
    PasswordResetContextApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PasswordResetContext'}
    PasswordResetCompleteApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PasswordResetComplete'}
    SmsPasswordResetResultApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SmsPasswordResetResult'}
    VoidApiResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {type: ['null']}
    SuccessEnvelope:
      type: object
      required: [code, message, timestamp]
      properties:
        code: {type: string, const: '0'}
        message: {type: string}
        timestamp: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
    ErrorApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, timestamp]
      properties:
        code: {type: string}
        message: {type: string}
        timestamp: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
