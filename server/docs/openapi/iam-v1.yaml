    TenantOwnerPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [reauthTicket, reason]
      properties:
        reauthTicket:
          type: string
          writeOnly: true
          pattern: '^[A-Za-z0-9_-]{43,128}$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    TenantOwnerActivationLink:
      type: object
      additionalProperties: false
      required: [tenantId, accountId, activationTicket, expiresAt]
      properties:
        tenantId: {type: string, pattern: '^[1-9][0-9]*$'}
        accountId: {type: string, pattern: '^[1-9][0-9]*$'}
        activationTicket: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
    TenantOwnerPasswordResetLink:
      type: object
      additionalProperties: false
      required: [tenantId, accountId, resetTicket, expiresAt]
      properties:
        tenantId: {type: string, pattern: '^[1-9][0-9]*$'}
        accountId: {type: string, pattern: '^[1-9][0-9]*$'}
        resetTicket: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
    OrgTypeTemplateItem:
      type: object
      additionalProperties: false
      required: [typeCode, name, sortOrder]
      properties:
        typeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        sortOrder:
          type: integer
          minimum: 0
    OrgTypeTemplateRelation:
      type: object
      additionalProperties: false
      required: [parentTypeCode, childTypeCode]
      properties:
        parentTypeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        childTypeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
    PublishOrgTypeTemplateRequest:
      type: object
      additionalProperties: false
      required: [types, relations]
      properties:
        types:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrgTypeTemplateItem'
        relations:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/OrgTypeTemplateRelation'
    OrgTypeTemplate:
      type: object
      additionalProperties: false
      required: [templateVersion, status, types, relations]
      properties:
        templateVersion:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          const: PUBLISHED
        types:
          type: array
          items:
            $ref: '#/components/schemas/OrgTypeTemplateItem'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/OrgTypeTemplateRelation'
    RootOrganizationRequest:
      type: object
      additionalProperties: false
      required: [typeCode, businessCode, name]
      properties:
        typeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 64
        businessCode:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        adminRegionId:
          type: string
          pattern: '^[1-9][0-9]*$'
    TenantOwnerRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          maxLength: 128
        employeeNumber:
          type: string
          maxLength: 64
    TenantSecurityPolicyRequest:
      type: object
      additionalProperties: false
      required: [concurrentLoginEnabled, maxDevices, rememberMeEnabled, idleSeconds, absoluteSeconds,
        rememberIdleSeconds, rememberAbsoluteSeconds, passwordExpiryEnabled, auditRetentionDays]
      properties:
        concurrentLoginEnabled: { type: boolean }
        maxDevices: { type: integer, minimum: 1, maximum: 100 }
        rememberMeEnabled: { type: boolean }
        idleSeconds: { type: integer, minimum: 60 }
        absoluteSeconds: { type: integer, minimum: 60 }
        rememberIdleSeconds: { type: integer, minimum: 60 }
        rememberAbsoluteSeconds: { type: integer, minimum: 60 }
        passwordExpiryEnabled: { type: boolean }
        passwordExpiryDays: { type: integer, minimum: 1, maximum: 3650 }
        auditRetentionDays: { type: integer, minimum: 180 }
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [tenantCode, name, templateVersion, rootOrganization, owner, securityPolicy]
      properties:
        tenantCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]*$'
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        templateVersion:
          type: integer
          format: int64
          minimum: 1
        rootOrganization:
          $ref: '#/components/schemas/RootOrganizationRequest'
        owner:
          $ref: '#/components/schemas/TenantOwnerRequest'
        securityPolicy:
          $ref: '#/components/schemas/TenantSecurityPolicyRequest'
    TenantCreation:
      type: object
      additionalProperties: false
      required: [tenant, ownerAccountId, ownerStatus]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        ownerAccountId:
          type: string
          pattern: '^[1-9][0-9]*$'
        ownerStatus:
          type: string
          const: PENDING_ACTIVATION
    TenantStatus:
      type: string
      description: 租户生命周期状态。
      enum:
        - INITIALIZING
        - ACTIVE
        - SUSPENDED
        - EXPIRED
        - CANCELLED
    TenantProvisionStatus:
      type: string
      description: IAM 与 Auth 的租户初始化编排状态。
      enum:
        - INITIALIZING
        - ACTIVE
        - PROVISION_FAILED
    TenantSummary:
      type: object
      description: 平台端租户分页摘要。
      additionalProperties: false
      required:
        - id
        - tenantCode
        - name
        - status
        - securityVersion
        - templateVersion
        - provisionStatus
        - createdTime
        - version
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: 租户 bigint 主键的十进制字符串。
        tenantCode:
          type: string
          description: 永久唯一且原则上不可修改的租户业务编码。
        name:
          type: string
          description: 租户名称。
        status:
          $ref: '#/components/schemas/TenantStatus'
        rootOrganizationId:
          type:
            - string
            - 'null'
          pattern: '^[1-9][0-9]*$'
          description: 根机构 bigint ID 的十进制字符串，初始化期间为空。
        securityVersion:
          type: integer
          format: int64
          minimum: 0
          description: 租户安全版本，提升后使租户全部会话失效。
        templateVersion:
          type: integer
          format: int64
          minimum: 0
          description: 初始化使用的机构类型模板版本。
        provisionStatus:
          $ref: '#/components/schemas/TenantProvisionStatus'
        createdTime:
          type: string
          format: date-time
          description: 租户创建时间，包含时区。
        version:
          type: integer
          format: int64
          minimum: 0
          description: 更新接口使用的乐观锁版本。
    TenantPage:
      type: object
      description: 租户分页数据。
      additionalProperties: false
      required:
        - items
        - pageNo
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
        pageNo:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    TenantPageApiResponse:
      type: object
      description: 统一租户分页成功响应。
      additionalProperties: false
      required:
        - code
        - message
        - data
        - timestamp
      properties:
        code:
          type: string
          const: '0'
        message:
          type: string
        data:
          $ref: '#/components/schemas/TenantPage'
        timestamp:
          type: string
          format: date-time
        traceId:
          type:
            - string
            - 'null'
    TenantCreationApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: string, const: '0' }
        message: { type: string }
        data:
          $ref: '#/components/schemas/TenantCreation'
        timestamp: { type: string, format: date-time }
        traceId:
          type: [string, 'null']
    TenantOwnerActivationLinkApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: {type: string, const: '0'}
        message: {type: string}
        data: {$ref: '#/components/schemas/TenantOwnerActivationLink'}
        timestamp: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
    TenantOwnerPasswordResetLinkApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: {type: string, const: '0'}
        message: {type: string}
        data: {$ref: '#/components/schemas/TenantOwnerPasswordResetLink'}
        timestamp: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
    OrgTypeTemplateApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: string, const: '0' }
        message: { type: string }
        data:
          $ref: '#/components/schemas/OrgTypeTemplate'
        timestamp: { type: string, format: date-time }
        traceId:
          type: [string, 'null']
    OrgTypeTemplateListApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: string, const: '0' }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrgTypeTemplate'
        timestamp: { type: string, format: date-time }
        traceId:
          type: [string, 'null']
    ErrorApiResponse:
      type: object
      description: 统一失败响应，不返回业务数据。
      additionalProperties: false
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type:
            - string
            - 'null'
