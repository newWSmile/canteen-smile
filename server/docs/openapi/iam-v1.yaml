openapi: 3.1.0
info:
  title: Canteen Smile IAM API
  version: 1.0.0
  description: IAM 服务已经实现并冻结的外部 REST 契约；未实现接口不得提前写入本文件。
servers:
  - url: /api/iam/v1
paths:
  /platform/tenants:
    get:
      operationId: pagePlatformTenants
      summary: 平台端分页查询租户
      description: 仅独立平台身份可调用，并由 IAM 服务最终校验 platform:tenant:view 权限。
      tags:
        - PlatformTenant
      parameters:
        - name: pageNo
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每页数量，最大 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: 租户生命周期状态过滤条件。
          schema:
            $ref: '#/components/schemas/TenantStatus'
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPageApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createPlatformTenant
      summary: 创建并初始化租户
      description: IAM 本地事务同步创建根机构、首位所有者、保护角色、安全策略、审计和 Outbox，再通过 HMAC Client 幂等初始化 Auth 待激活凭证。失败后可使用相同幂等键重试。
      tags:
        - PlatformTenant
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一创建命令重试时保持不变，最长 128 字符。
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: 租户和 Auth 待激活凭证初始化完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreationApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 永久唯一字段或幂等键冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '502':
          description: Auth 暂时不可用；IAM 已保留租户并标记为可重试。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /platform/tenants/{tenantId}/owner/activation-links:
    post:
      operationId: issueTenantOwnerActivationLink
      summary: 为租户首位所有者生成一次性激活链接票据
      description: 仅待激活所有者可执行；新票据 24 小时有效并废弃此前未使用票据。
      tags: [PlatformTenant]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
      responses:
        '201':
          description: 激活票据签发成功，只在本次响应展示。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantOwnerActivationLinkApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/tenants/{tenantId}/owner/password-reset-links:
    post:
      operationId: issueTenantOwnerPasswordResetLink
      summary: 为租户所有者生成一次性密码恢复链接票据
      description: 要求 iam:user:password-reset 权限、必填原因及当前密码再认证；签发后全部设备立即下线，旧密码停止登录，票据 30 分钟有效。
      tags: [PlatformTenant]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantOwnerPasswordResetRequest'}
      responses:
        '201':
          description: 密码恢复票据签发成功，只在本次响应展示。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantOwnerPasswordResetLinkApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/org-type-templates:
    get:
      operationId: listPublishedOrgTypeTemplates
      summary: 查询已发布机构类型模板版本
      tags:
        - PlatformOrganizationTemplate
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgTypeTemplateListApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: publishOrgTypeTemplate
      summary: 发布完整不可变机构类型模板版本
      description: 服务端校验编码唯一、关系引用、禁止自环及整图无环后分配新版本。
      tags:
        - PlatformOrganizationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishOrgTypeTemplateRequest'
      responses:
        '201':
          description: 新模板版本发布成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgTypeTemplateApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tenant/context:
    get:
      operationId: getTenantManagementContext
      summary: 查询当前租户管理身份和最终权限
      tags: [TenantContext]
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantManagementContextApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenant/organization-types:
    get:
      operationId: pageTenantOrganizationTypes
      summary: 分页查询当前租户机构类型
      description: 要求 iam:org-type:view 权限，所有查询条件均固定在当前登录租户内。
      tags: [TenantOrganizationType]
      parameters:
        - {$ref: '#/components/parameters/PageNo'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ActiveStatus'}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypePageApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTenantOrganizationType
      summary: 新增当前租户机构类型
      description: 仅租户根机构所有者且具备 iam:org-type:manage 权限可调用；类型编码永久保留。
      tags: [TenantOrganizationType]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationTypeRequest'}
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypeApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenant/organization-types/active:
    get:
      operationId: listActiveTenantOrganizationTypes
      summary: 查询当前租户全部有效机构类型
      tags: [TenantOrganizationType]
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypeListApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenant/organization-types/{typeId}:
    put:
      operationId: updateTenantOrganizationType
      summary: 修改机构类型名称和排序
      tags: [TenantOrganizationType]
      parameters:
        - {$ref: '#/components/parameters/TypeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationTypeRequest'}
      responses:
        '200':
          description: 修改成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypeApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenant/organization-types/{typeId}/status:
    put:
      operationId: changeTenantOrganizationTypeStatus
      summary: 停用或恢复机构类型
      description: 正在被机构使用的类型不能停用。
      tags: [TenantOrganizationType]
      parameters:
        - {$ref: '#/components/parameters/TypeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeOrganizationTypeStatusRequest'}
      responses:
        '200':
          description: 状态修改成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypeApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenant/organization-type-relations:
    get:
      operationId: listTenantOrganizationTypeRelations
      summary: 查询当前租户有效机构类型允许关系
      tags: [TenantOrganizationType]
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypeRelationListApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: replaceTenantOrganizationTypeRelations
      summary: 整版替换当前租户机构类型允许关系
      description: 后端校验引用有效、无重复、整图无环，并禁止删除真实机构树正在使用的父子类型关系。
      tags: [TenantOrganizationType]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceOrganizationTypeRelationsRequest'}
      responses:
        '200':
          description: 保存成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationTypeRelationListApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenant/organizations/root:
    get:
      operationId: getTenantRootOrganization
      summary: 查询当前租户根机构
      tags: [TenantOrganization]
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenant/organizations:
    get:
      operationId: pageTenantChildOrganizations
      summary: 分页查询直属子机构
      description: 不加载整棵机构树，要求 iam:org:view 权限。
      tags: [TenantOrganization]
      parameters:
        - name: parentId
          in: query
          required: true
          schema: {$ref: '#/components/schemas/BigintId'}
        - {$ref: '#/components/parameters/PageNo'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationPageApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTenantOrganization
      summary: 新增直属子机构
      description: 后端校验租户边界、父机构实际状态、有效机构类型、允许关系、行政区域和永久业务编码。
      tags: [TenantOrganization]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenant/organizations/search:
    get:
      operationId: searchTenantOrganizations
      summary: 有界搜索当前租户机构
      description: 按名称或业务编码搜索，至少两个字符，最多返回二十条并包含祖先面包屑。
      tags: [TenantOrganization]
      parameters:
        - name: keyword
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 200}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationSearchListApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenant/organizations/{organizationId}:
    get:
      operationId: getTenantOrganization
      summary: 查询机构详情
      tags: [TenantOrganization]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationApiResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateTenantOrganization
      summary: 修改机构名称、类型和行政区域关联
      description: 修改类型时校验当前父类型和全部直属子类型关系。
      tags: [TenantOrganization]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationRequest'}
      responses:
        '200':
          description: 修改成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteBlankTenantOrganization
      summary: 删除完全空白机构
      description: 根机构以及存在子机构、账号、角色或所有者绑定的机构不能删除；业务编码永久保留。
      tags: [TenantOrganization]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteOrganizationRequest'}
      responses:
        '200':
          description: 删除成功。
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenant/organizations/{organizationId}/parent:
    put:
      operationId: moveTenantOrganization
      summary: 将机构迁移到合法的新父机构
      description: 禁止移动根机构、形成机构环或违反类型允许关系；闭包路径在同一事务内重建。
      tags: [TenantOrganization]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveOrganizationRequest'}
      responses:
        '200':
          description: 迁移成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenant/organizations/{organizationId}/status:
    put:
      operationId: changeTenantOrganizationStatus
      summary: 停用或恢复机构自身状态
      description: 父机构停用后全部下级机构通过闭包查询继承停用；根机构状态由平台租户生命周期管理。
      tags: [TenantOrganization]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeOrganizationStatusRequest'}
      responses:
        '200':
          description: 状态修改成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationApiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    PageNo:
      name: pageNo
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    TypeId:
      name: typeId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/BigintId'}
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/BigintId'}
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 分页或状态参数不符合约束。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    Unauthorized:
      description: 当前请求尚未登录。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    Forbidden:
      description: 当前平台身份没有查看租户权限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    InternalError:
      description: 服务端未预期异常。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    Conflict:
      description: 目标所有者生命周期状态不允许当前操作，或状态已经变化。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    NotFound:
      description: 当前租户边界内不存在目标资源。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
  schemas:
    BigintId:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 避免 JavaScript 精度丢失的 bigint 十进制字符串。
    ActiveStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    TenantManagementContext:
      type: object
      additionalProperties: false
      required: [accountId, username, tenantId, tenantName, organizationId, organizationName, rootOrganizationId, rootOwner, permissions]
      properties:
        accountId: {$ref: '#/components/schemas/BigintId'}
        username: {type: string}
        displayName: {type: [string, 'null']}
        tenantId: {$ref: '#/components/schemas/BigintId'}
        tenantName: {type: string}
        organizationId: {$ref: '#/components/schemas/BigintId'}
        organizationName: {type: string}
        rootOrganizationId: {$ref: '#/components/schemas/BigintId'}
        rootOwner: {type: boolean}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string}
    OrganizationType:
      type: object
      additionalProperties: false
      required: [id, typeCode, name, sortOrder, status, sourceTemplateVersion, version]
      properties:
        id: {$ref: '#/components/schemas/BigintId'}
        typeCode: {type: string}
        name: {type: string}
        sortOrder: {type: integer, minimum: 0, maximum: 100000}
        status: {$ref: '#/components/schemas/ActiveStatus'}
        sourceTemplateVersion: {type: [integer, 'null'], format: int64}
        version: {type: integer, format: int64, minimum: 0}
    OrganizationTypeRelation:
      type: object
      additionalProperties: false
      required: [id, parentTypeId, childTypeId, version]
      properties:
        id: {$ref: '#/components/schemas/BigintId'}
        parentTypeId: {$ref: '#/components/schemas/BigintId'}
        childTypeId: {$ref: '#/components/schemas/BigintId'}
        version: {type: integer, format: int64, minimum: 0}
    Organization:
      type: object
      additionalProperties: false
      required: [id, parentId, organizationTypeId, typeCode, typeName, businessCode, name, adminRegionId, ownStatus, effectiveStatus, pathVersion, hasChildren, version]
      properties:
        id: {$ref: '#/components/schemas/BigintId'}
        parentId:
          oneOf:
            - {$ref: '#/components/schemas/BigintId'}
            - {type: 'null'}
        organizationTypeId: {$ref: '#/components/schemas/BigintId'}
        typeCode: {type: string}
        typeName: {type: string}
        businessCode: {type: string}
        name: {type: string}
        adminRegionId:
          oneOf:
            - {$ref: '#/components/schemas/BigintId'}
            - {type: 'null'}
        ownStatus: {$ref: '#/components/schemas/ActiveStatus'}
        effectiveStatus: {$ref: '#/components/schemas/ActiveStatus'}
        pathVersion: {type: integer, format: int64, minimum: 0}
        hasChildren: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    OrganizationSearchResult:
      type: object
      additionalProperties: false
      required: [id, parentId, organizationTypeId, typeName, businessCode, name, effectiveStatus, breadcrumb]
      properties:
