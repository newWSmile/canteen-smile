        message: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/RoleDataPolicy'}}
        timestamp: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
    GrantBoundaryApiResponse:
      type: object
