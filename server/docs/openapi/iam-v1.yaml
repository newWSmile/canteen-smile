      required: [code, message, data, timestamp]
      properties:
        code: {type: string, const: '0'}
        message: {type: string}
        data: {$ref: '#/components/schemas/PermissionResource'}
        timestamp: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
    PermissionResourcePageApiResponse:
