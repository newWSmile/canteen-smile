spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:canteen_smile}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  data:
    redis:
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}

logging:
  level:
    com.canteen.smile: DEBUG

application:
  bootstrap:
    # 开发环境真实值通过环境变量提供，禁止提交到本文件。
    secret: ${PLATFORM_BOOTSTRAP_SECRET:}
  internal-hmac:
    # 必须与 IAM 开发环境的同名密钥完全一致。
    secret: ${INTERNAL_HMAC_AUTH_TO_IAM_SECRET:}
