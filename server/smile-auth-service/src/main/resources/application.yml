spring:
  application:
    name: smile-auth-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            dynamic-refresh-sources: true
            period: ${REDIS_CLUSTER_REFRESH_PERIOD:30s}

server:
  port: ${AUTH_SERVICE_PORT:8081}
  shutdown: graceful

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.canteen.smile.modules.*.entity

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT_SECONDS:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT_SECONDS:-1}
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

application:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:canteen-smile}
  bootstrap:
    secret: ${PLATFORM_BOOTSTRAP_SECRET:}
    recovery-code-count: ${PLATFORM_BOOTSTRAP_RECOVERY_CODE_COUNT:10}
  password-envelope:
    challenge-ttl-seconds: ${PASSWORD_ENVELOPE_CHALLENGE_TTL_SECONDS:120}
    rsa-key-size: ${PASSWORD_ENVELOPE_RSA_KEY_SIZE:2048}
    rsa-key-rotation-days: ${PASSWORD_ENVELOPE_RSA_KEY_ROTATION_DAYS:30}
  clients:
    iam:
      base-url: ${IAM_SERVICE_URI:http://127.0.0.1:8082}
      connect-timeout-millis: ${IAM_CLIENT_CONNECT_TIMEOUT_MS:2000}
      read-timeout-millis: ${IAM_CLIENT_READ_TIMEOUT_MS:3000}
  internal-hmac:
    caller-id: ${INTERNAL_HMAC_CALLER_ID:smile-auth-service}
    key-id: ${INTERNAL_HMAC_KEY_ID:v1}
    secret: ${INTERNAL_HMAC_AUTH_TO_IAM_SECRET:}
  inbound-hmac:
    allowed-caller-id: ${INTERNAL_HMAC_IAM_CALLER_ID:smile-iam-service}
    key-id: ${INTERNAL_HMAC_KEY_ID:v1}
    secret: ${INTERNAL_HMAC_AUTH_TO_IAM_SECRET:${application.internal-hmac.secret:}}
    allowed-clock-skew-seconds: ${INTERNAL_HMAC_CLOCK_SKEW_SECONDS:300}
    nonce-ttl-seconds: ${INTERNAL_HMAC_NONCE_TTL_SECONDS:600}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:16}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
    keep-alive-seconds: ${ASYNC_KEEP_ALIVE_SECONDS:60}
    task-timeout-seconds: ${ASYNC_TASK_TIMEOUT_SECONDS:30}

logging:
  level:
    root: INFO
    com.canteen.smile: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
