spring:
  application:
    name: smile-iam-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${IAM_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${IAM_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${IAM_DB_CONNECTION_TIMEOUT_MS:30000}
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            dynamic-refresh-sources: true
            period: ${REDIS_CLUSTER_REFRESH_PERIOD:30s}

server:
  port: ${IAM_SERVICE_PORT:8082}
  shutdown: graceful

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.canteen.smile.modules.*.entity

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT_SECONDS:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT_SECONDS:-1}
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

application:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:canteen-smile}
  internal-hmac:
    allowed-caller-id: ${INTERNAL_HMAC_ALLOWED_CALLER_ID:smile-auth-service}
    key-id: ${INTERNAL_HMAC_KEY_ID:v1}
    secret: ${INTERNAL_HMAC_AUTH_TO_IAM_SECRET:}
    allowed-clock-skew-seconds: ${INTERNAL_HMAC_CLOCK_SKEW_SECONDS:300}
    nonce-ttl-seconds: ${INTERNAL_HMAC_NONCE_TTL_SECONDS:600}
  clients:
    auth:
      base-url: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
      connect-timeout-millis: ${AUTH_CLIENT_CONNECT_TIMEOUT_MS:2000}
      read-timeout-millis: ${AUTH_CLIENT_READ_TIMEOUT_MS:3000}
  auth-client-hmac:
    caller-id: ${INTERNAL_HMAC_IAM_CALLER_ID:smile-iam-service}
    key-id: ${INTERNAL_HMAC_KEY_ID:v1}
    secret: ${INTERNAL_HMAC_AUTH_TO_IAM_SECRET:${application.internal-hmac.secret:}}
  outbox:
    delivery:
      batch-size: ${IAM_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${IAM_OUTBOX_MAX_ATTEMPTS:10}
      base-backoff-seconds: ${IAM_OUTBOX_BASE_BACKOFF_SECONDS:5}
      max-backoff-seconds: ${IAM_OUTBOX_MAX_BACKOFF_SECONDS:300}
      processing-lease-seconds: ${IAM_OUTBOX_PROCESSING_LEASE_SECONDS:60}
    xxl-job:
      enabled: ${XXL_JOB_ENABLED:false}
      admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
      app-name: ${XXL_JOB_APP_NAME:smile-iam-service}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job/iam}
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
      access-token: ${XXL_JOB_ACCESS_TOKEN:}
  async:
    core-pool-size: ${IAM_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${IAM_ASYNC_MAX_POOL_SIZE:16}
    queue-capacity: ${IAM_ASYNC_QUEUE_CAPACITY:200}
    keep-alive-seconds: ${IAM_ASYNC_KEEP_ALIVE_SECONDS:60}
    task-timeout-seconds: ${IAM_ASYNC_TASK_TIMEOUT_SECONDS:30}

logging:
  level:
    root: INFO
    com.canteen.smile: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
