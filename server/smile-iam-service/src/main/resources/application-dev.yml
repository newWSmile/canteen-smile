spring:
  datasource:
    url: ${IAM_DB_URL}
    username: ${IAM_DB_USERNAME}
    password: ${IAM_DB_PASSWORD}
  data:
    redis:
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}

logging:
  level:
    com.canteen.smile: DEBUG

application:
  internal-hmac:
    # 必须与 Auth 开发环境的同名密钥完全一致。
    secret: ${INTERNAL_HMAC_AUTH_TO_IAM_SECRET:}
